<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi novia 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #9b59b6;
    --pink: #e91e8c;
    --rose: #ff6b9d;
    --gold: #f5c842;
    --cream: #fff8f0;
    --deep: #1a0a2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Starfield */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--o, 0.8); transform: scale(1); }
  }

  /* Floating hearts background */
  .hearts-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .heart-float {
    position: absolute;
    bottom: -50px;
    font-size: var(--s, 1.5rem);
    animation: floatUp var(--d, 8s) ease-in infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0.15;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.2; }
    90% { opacity: 0.1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Screen management */
  .screen {
    position: relative; z-index: 10;
    width: min(520px, 92vw);
    text-align: center;
    display: none;
    animation: fadeIn 0.8s ease forwards;
  }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── SCREEN 1: entrada ── */
  #screen-intro .rain {
    font-size: 1.6rem;
    letter-spacing: 0.4rem;
    margin-bottom: 2.5rem;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  #screen-intro h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    color: var(--cream);
    font-style: italic;
    margin-bottom: 2rem;
    line-height: 1.3;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 1.8rem;
  }
  .input-wrap label {
    display: block;
    color: var(--rose);
    font-size: 1rem;
    letter-spacing: 0.08em;
    margin-bottom: 0.7rem;
    font-style: italic;
  }
  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(155, 89, 182, 0.4);
    border-radius: 4px;
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    padding: 0.85rem 1.2rem;
    text-align: center;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .input-wrap input::placeholder { color: rgba(255,255,255,0.25); }
  .input-wrap input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 20px rgba(155,89,182,0.25);
  }

  button {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: white;
    border: none;
    border-radius: 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-style: italic;
    letter-spacing: 0.06em;
    padding: 0.85rem 2.5rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(233,30,140,0.3);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(233,30,140,0.45);
  }
  button:active { transform: translateY(0); }

  /* ── SCREEN 2: corazón + poema ── */
  #screen-poem .heart-ascii {
    font-family: monospace;
    font-size: clamp(0.55rem, 1.8vw, 0.75rem);
    line-height: 1.15;
    color: #e74c3c;
    margin-bottom: 2rem;
    display: inline-block;
    text-shadow: 0 0 10px rgba(231,76,60,0.5);
    opacity: 0;
    animation: heartAppear 0.8s ease 0.2s forwards;
  }
  @keyframes heartAppear {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  .dedication {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--rose);
    font-style: italic;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.8s forwards;
  }

  .poem {
    background: rgba(255,255,255,0.04);
    border-left: 2px solid var(--purple);
    border-radius: 0 8px 8px 0;
    padding: 1.8rem 2rem;
    text-align: left;
    margin-bottom: 2rem;
  }
  .poem p {
    font-size: 1.05rem;
    line-height: 2;
    color: rgba(255,248,240,0.88);
    font-style: italic;
    opacity: 0;
    transform: translateX(-10px);
  }
  .poem p.name-line {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--gold);
    font-style: normal;
  }
  .poem p.empty { min-height: 1.2rem; }

  .rain-bottom {
    font-size: 1.4rem;
    letter-spacing: 0.5rem;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.5s forwards;
  }

  .restart-btn {
    opacity: 0;
    animation: fadeIn 0.8s ease 0.5s forwards;
    background: transparent;
    border: 1px solid rgba(155,89,182,0.5);
    font-size: 0.9rem;
    padding: 0.6rem 1.8rem;
    box-shadow: none;
    color: rgba(255,255,255,0.5);
  }
  .restart-btn:hover {
    background: rgba(155,89,182,0.15);
    box-shadow: none;
    color: var(--cream);
  }
</style>
</head>
<body>

<!-- Starfield -->
<div class="stars" id="stars"></div>

<!-- Floating hearts -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- SCREEN 1: Entrada -->
<div class="screen active" id="screen-intro">
  <div class="rain">❤️ &nbsp;💜 &nbsp;🩷 &nbsp;💛 &nbsp;💖 &nbsp;✨</div>
  <h1>Un pequeño programa<br>hecho con mucho amor 💜</h1>
  <div class="input-wrap">
    <label>¿Cuál es el nombre de tu novia?</label>
    <input type="text" id="nameInput" placeholder="Su nombre aquí..." maxlength="30" />
  </div>
  <button onclick="mostrarPoema()">Continuar →</button>
</div>

<!-- SCREEN 2: Corazón + Poema -->
<div class="screen" id="screen-poem">
  <pre class="heart-ascii">
    ██████   ██████
  ██████████████████
 ████████████████████
 ████████████████████
  ██████████████████
    ██████████████
      ██████████
        ██████
          ██</pre>

  <p class="dedication" id="dedication"></p>

  <div class="poem" id="poem"></div>

  <div class="rain-bottom" id="rainBottom"></div>

  <button class="restart-btn" onclick="reiniciar()">↩ Volver al inicio</button>
</div>

<script>
  // --- Stars ---
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      --o:${(Math.random()*0.6+0.2).toFixed(2)};
      animation-delay:${(Math.random()*4).toFixed(2)}s;
    `;
    starsEl.appendChild(s);
  }

  // --- Floating hearts ---
  const emojis = ['❤️','💜','🩷','💛','💖','✨','💕','🌸'];
  const bgEl = document.getElementById('heartsBg');
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.cssText = `
      left:${Math.random()*100}%;
      --s:${(Math.random()*1.5+0.8).toFixed(1)}rem;
      --d:${(Math.random()*8+6).toFixed(1)}s;
      --delay:${(Math.random()*10).toFixed(1)}s;
    `;
    bgEl.appendChild(h);
  }

  // --- Enter key support ---
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') mostrarPoema();
  });

  function mostrarPoema() {
    let nombre = document.getElementById('nameInput').value.trim() || 'mi amor';

    // Capitalizar primera letra
    nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);

    // Versos
    const versos = [
      { text: `Para ti, ${nombre}:`, cls: 'name-line' },
      { text: '', cls: 'empty' },
      { text: 'Cada día contigo es un regalo,' },
      { text: 'cada sonrisa tuya, mi mundo entero.' },
      { text: 'Eres la razón de mis pasos,' },
      { text: 'el hogar más cálido que conozco.' },
      { text: '', cls: 'empty' },
      { text: 'No necesito buscar más lejos,' },
      { text: 'teniendo tu mano en la mía.' },
      { text: 'Eres mi calma en los momentos difíciles' },
      { text: 'y mi alegría en cada nuevo día.' },
      { text: '', cls: 'empty' },
      { text: `Gracias por existir, ${nombre}. 💜`, cls: 'name-line' },
      { text: 'Te quiero más de lo que las palabras pueden decir.' },
    ];

    // Build poem
    const poemEl = document.getElementById('poem');
    poemEl.innerHTML = '';
    versos.forEach(v => {
      const p = document.createElement('p');
      p.textContent = v.text;
      if (v.cls) p.classList.add(v.cls);
      poemEl.appendChild(p);
    });

    document.getElementById('dedication').textContent =
      `💜 Este programa fue hecho con amor para ${nombre} 💜`;

    document.getElementById('rainBottom').textContent =
      '❤️  💜  🩷  💛  💖  ✨';

    // Switch screens
    document.getElementById('screen-intro').classList.remove('active');
    const poemScreen = document.getElementById('screen-poem');
    poemScreen.classList.add('active');

    // Animate poem lines
    const lines = poemEl.querySelectorAll('p');
    lines.forEach((line, i) => {
      setTimeout(() => {
        line.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        line.style.opacity = '1';
        line.style.transform = 'translateX(0)';
      }, 1000 + i * 120);
    });

    // Animate bottom rain after lines
    const rainEl = document.getElementById('rainBottom');
    rainEl.style.animationDelay = `${1000 + lines.length * 120 + 200}ms`;
  }

  function reiniciar() {
    document.getElementById('screen-poem').classList.remove('active');
    document.getElementById('nameInput').value = '';
    const intro = document.getElementById('screen-intro');
    intro.style.animation = 'none';
    intro.classList.add('active');
    void intro.offsetWidth;
    intro.style.animation = '';
  }
</script>
</body>
</html>
